<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60" role="img" aria-label="Get it on Google Play">
  <defs>
    <linearGradient id="pl1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0c36b"/>
      <stop offset="1" stop-color="#e0a233"/>
    </linearGradient>
    <linearGradient id="pl2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <rect x=".75" y=".75" width="198.5" height="58.5" rx="14"
        fill="#100b1c" stroke="rgba(255,255,255,.18)" stroke-width="1.5"/>

  <!-- Play triangle, built from two tones so it reads as a play mark, not Google's mark -->
  <g transform="translate(20 15)">
    <path d="M1.6 0.6 L17.2 15 L1.6 29.4 C0.6 28.9 0 27.9 0 26.6 V3.4 C0 2.1 0.6 1.1 1.6 0.6 Z" fill="url(#pl2)"/>
    <path d="M1.6 0.6 C2.3 0.2 3.2 0.3 4 0.8 L23.4 11.6 L17.2 15 Z" fill="url(#pl1)"/>
    <path d="M17.2 15 L23.4 18.4 L4 29.2 C3.2 29.7 2.3 29.8 1.6 29.4 Z" fill="url(#pl1)" opacity=".78"/>
    <path d="M23.4 11.6 L28.4 14.4 C29.9 15.2 29.9 16.8 28.4 17.6 L23.4 18.4 L17.2 15 Z" fill="url(#pl2)" opacity=".8"/>
  </g>

  <text x="62" y="25" fill="#b9b4c9" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="10" letter-spacing="1.4" font-weight="600">GET IT ON</text>
  <text x="62" y="44" fill="#ffffff" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="19" letter-spacing="-.4" font-weight="700">Google Play</text>
</svg>
